<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arduino Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    /* Splash Screen */
    #splashScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      cursor: pointer;
      opacity: 1;
      transition: opacity 1s ease-out;
      overflow: hidden;
    }

    /* Floating Background Components */
    .floating-component {
      position: absolute;
      opacity: 0.25;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.9)) drop-shadow(0 0 15px rgba(255, 255, 255, 0.6)) drop-shadow(0 0 25px rgba(255, 255, 255, 0.3));
      pointer-events: none;
    }

    /* Vary component sizes */
    .component-1 svg {
      width: 140px;
      height: 95px;
    }

    .component-2 svg {
      width: 110px;
      height: 75px;
    }

    .component-3 svg {
      width: 90px;
      height: 70px;
    }

    .component-4 svg {
      width: 50px;
      height: 70px;
    }

    .component-5 svg {
      width: 110px;
      height: 45px;
    }

    .component-6 svg {
      width: 70px;
      height: 60px;
    }

    .component-7 svg {
      width: 60px;
      height: 70px;
    }

    .component-8 svg {
      width: 160px;
      height: 100px;
    }

    .component-9 svg {
      width: 90px;
      height: 80px;
    }

    .component-10 svg {
      width: 80px;
      height: 80px;
    }

    .component-11 svg {
      width: 70px;
      height: 60px;
    }

    .component-12 svg {
      width: 60px;
      height: 90px;
    }

    .component-13 svg {
      width: 70px;
      height: 60px;
    }

    .component-14 svg {
      width: 100px;
      height: 80px;
    }

    .component-15 svg {
      width: 110px;
      height: 70px;
    }

    .floating-component svg {
      stroke: #ffffff;
      stroke-width: 2;
      fill: none;
    }

    /* Floating animations */
    @keyframes float1 {

      0%,
      100% {
        transform: translate(0, 0) rotate(0deg) scale(1);
      }

      33% {
        transform: translate(30px, -30px) rotate(5deg) scale(1.1);
      }

      66% {
        transform: translate(-20px, 20px) rotate(-5deg) scale(0.9);
      }
    }

    @keyframes float2 {

      0%,
      100% {
        transform: translate(0, 0) rotate(0deg) scale(1);
      }

      33% {
        transform: translate(-40px, 40px) rotate(-8deg) scale(1.15);
      }

      66% {
        transform: translate(25px, -25px) rotate(8deg) scale(0.85);
      }
    }

    @keyframes float3 {

      0%,
      100% {
        transform: translate(0, 0) rotate(0deg) scale(1);
      }

      50% {
        transform: translate(50px, -50px) rotate(10deg) scale(1.2);
      }
    }

    @keyframes float4 {

      0%,
      100% {
        transform: translate(0, 0) rotate(0deg) scale(1);
      }

      50% {
        transform: translate(-60px, 60px) rotate(-12deg) scale(0.8);
      }
    }

    @keyframes float5 {

      0%,
      100% {
        transform: translate(0, 0) rotate(0deg) scale(1);
      }

      25% {
        transform: translate(35px, 35px) rotate(6deg) scale(1.05);
      }

      75% {
        transform: translate(-35px, -35px) rotate(-6deg) scale(0.95);
      }
    }

    .component-1 {
      animation: float1 8s ease-in-out infinite;
      top: 5%;
      left: 8%;
    }

    .component-2 {
      animation: float2 10s ease-in-out infinite;
      top: 15%;
      right: 12%;
    }

    .component-3 {
      animation: float3 12s ease-in-out infinite;
      bottom: 20%;
      left: 15%;
    }

    .component-4 {
      animation: float4 9s ease-in-out infinite;
      bottom: 10%;
      right: 8%;
    }

    .component-5 {
      animation: float5 11s ease-in-out infinite;
      top: 45%;
      left: 3%;
    }

    .component-6 {
      animation: float1 13s ease-in-out infinite;
      top: 60%;
      right: 5%;
    }

    .component-7 {
      animation: float2 7s ease-in-out infinite;
      bottom: 30%;
      left: 8%;
    }

    .component-8 {
      animation: float3 11s ease-in-out infinite;
      top: 25%;
      left: 50%;
    }

    .component-9 {
      animation: float4 9s ease-in-out infinite;
      bottom: 40%;
      right: 20%;
    }

    .component-10 {
      animation: float5 10s ease-in-out infinite;
      top: 70%;
      left: 25%;
    }

    .component-11 {
      animation: float1 8s ease-in-out infinite;
      bottom: 50%;
      right: 30%;
    }

    .component-12 {
      animation: float2 12s ease-in-out infinite;
      top: 35%;
      right: 40%;
    }

    .component-13 {
      animation: float3 9s ease-in-out infinite;
      bottom: 60%;
      left: 40%;
    }

    .component-14 {
      animation: float4 11s ease-in-out infinite;
      top: 80%;
      right: 25%;
    }

    .component-15 {
      animation: float5 10s ease-in-out infinite;
      bottom: 15%;
      left: 50%;
    }

    #splashScreen.fading {
      opacity: 0;
    }

    #splashScreen.hidden {
      display: none;
    }

    #gameWiseContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin-bottom: 40px;
      opacity: 1;
      transition: opacity 1s ease-out;
      z-index: 10001;
    }

    #gameWiseContainer.fading {
      opacity: 0;
    }

    /* Hide main content initially */
    #mainContent {
      opacity: 0;
      transition: opacity 0.5s ease-in;
    }

    #mainContent.visible {
      opacity: 1;
    }

    /* Top UI bar */
    #uiBar {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 12px;
      /* spacing between elements */
      z-index: 200;
    }

    #addWireBtn {
      padding: 10px 16px;
      background: #333;
      color: white;
      border-radius: 6px;
      border: 1px solid #555;
      cursor: pointer;
      font-size: 14px;
    }

    #wireColorPicker {
      padding: 10px;
      background: #333;
      color: white;
      border-radius: 6px;
      border: 1px solid #555;
      font-size: 14px;
      cursor: pointer;
    }

    #pinLabel {
      position: absolute;
      padding: 6px 10px;
      background: #111;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
      display: none;
      pointer-events: none;
      z-index: 100;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.4);
    }

    #sidebar {
      position: fixed;
      left: 10px;
      top: 120px;
      background: #1a1a1a;
      padding: 10px 20px;
      border-radius: 8px;
      color: white;
      z-index: 210;
    }

    .spawn {
      display: block;
      width: 100%;
      margin: 6px 0;
      padding: 8px;
      background: #333;
      color: white;
      border: none;
      cursor: pointer;
    }

    .spawn:hover {
      background: #444;
    }

    #loadingOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-family: 'Press Start 2P', cursive;
      z-index: 20000;
    }

    #loadingOverlay.hidden {
      display: none;
    }

    #moveBoardBtn {
      padding: 10px 16px;
      background: #333;
      color: white;
      border-radius: 6px;
      border: 1px solid #555;
      cursor: pointer;
      font-size: 14px;
    }

    #moveBoardBtn.active {
      background: #0066ff;
    }
  </style>
  <link rel="stylesheet" href="/src/Shuffle.css">
</head>

<body>

  <!-- Splash Screen -->
  <div id="splashScreen">
    <!-- Floating Background Components -->
    <div class="floating-component component-1"><!-- Game Controller --><svg width="120" height="80"
        viewBox="0 0 120 80">
        <rect x="20" y="25" width="80" height="50" rx="10" stroke="white" stroke-width="2" fill="none" />
        <circle cx="40" cy="45" r="8" stroke="white" stroke-width="2" fill="none" />
        <circle cx="80" cy="45" r="8" stroke="white" stroke-width="2" fill="none" />
        <rect x="50" y="35" width="20" height="20" rx="3" stroke="white" stroke-width="2" fill="none" />
        <line x1="10" y1="40" x2="20" y2="40" stroke="white" stroke-width="2" />
        <line x1="10" y1="60" x2="20" y2="60" stroke="white" stroke-width="2" />
        <line x1="100" y1="40" x2="110" y2="40" stroke="white" stroke-width="2" />
        <line x1="100" y1="60" x2="110" y2="60" stroke="white" stroke-width="2" />
      </svg></div>
    <div class="floating-component component-2"><!-- Arduino Board --><svg width="100" height="70" viewBox="0 0 100 70">
        <rect x="10" y="10" width="80" height="50" rx="2" stroke="white" stroke-width="2" fill="none" />
        <rect x="15" y="15" width="70" height="40" rx="1" stroke="white" stroke-width="1.5" fill="none" />
        <!-- Pins on left -->
        <line x1="10" y1="20" x2="5" y2="20" stroke="white" stroke-width="1.5" />
        <line x1="10" y1="25" x2="5" y2="25" stroke="white" stroke-width="1.5" />
        <line x1="10" y1="30" x2="5" y2="30" stroke="white" stroke-width="1.5" />
        <line x1="10" y1="35" x2="5" y2="35" stroke="white" stroke-width="1.5" />
        <line x1="10" y1="40" x2="5" y2="40" stroke="white" stroke-width="1.5" />
        <line x1="10" y1="45" x2="5" y2="45" stroke="white" stroke-width="1.5" />
        <!-- Pins on right -->
        <line x1="90" y1="20" x2="95" y2="20" stroke="white" stroke-width="1.5" />
        <line x1="90" y1="25" x2="95" y2="25" stroke="white" stroke-width="1.5" />
        <line x1="90" y1="30" x2="95" y2="30" stroke="white" stroke-width="1.5" />
        <line x1="90" y1="35" x2="95" y2="35" stroke="white" stroke-width="1.5" />
        <line x1="90" y1="40" x2="95" y2="40" stroke="white" stroke-width="1.5" />
        <line x1="90" y1="45" x2="95" y2="45" stroke="white" stroke-width="1.5" />
        <!-- USB port -->
        <rect x="40" y="5" width="20" height="5" rx="1" stroke="white" stroke-width="1.5" fill="none" />
      </svg></div>
    <div class="floating-component component-3"><!-- Ultrasonic Sensor --><svg width="80" height="60"
        viewBox="0 0 80 60">
        <rect x="10" y="15" width="60" height="30" rx="3" stroke="white" stroke-width="2" fill="none" />
        <circle cx="20" cy="30" r="5" stroke="white" stroke-width="2" fill="none" />
        <circle cx="60" cy="30" r="5" stroke="white" stroke-width="2" fill="none" />
        <line x1="5" y1="20" x2="10" y2="20" stroke="white" stroke-width="1.5" />
        <line x1="5" y1="25" x2="10" y2="25" stroke="white" stroke-width="1.5" />
        <line x1="5" y1="30" x2="10" y2="30" stroke="white" stroke-width="1.5" />
        <line x1="5" y1="35" x2="10" y2="35" stroke="white" stroke-width="1.5" />
        <line x1="70" y1="20" x2="75" y2="20" stroke="white" stroke-width="1.5" />
        <line x1="70" y1="25" x2="75" y2="25" stroke="white" stroke-width="1.5" />
        <line x1="70" y1="30" x2="75" y2="30" stroke="white" stroke-width="1.5" />
        <line x1="70" y1="35" x2="75" y2="35" stroke="white" stroke-width="1.5" />
      </svg></div>
    <div class="floating-component component-4"><!-- LED --><svg width="40" height="60" viewBox="0 0 40 60">
        <circle cx="20" cy="20" r="12" stroke="white" stroke-width="2" fill="none" />
        <line x1="20" y1="32" x2="20" y2="50" stroke="white" stroke-width="2" />
        <line x1="15" y1="50" x2="25" y2="50" stroke="white" stroke-width="2" />
        <line x1="8" y1="20" x2="2" y2="20" stroke="white" stroke-width="1.5" />
        <line x1="32" y1="20" x2="38" y2="20" stroke="white" stroke-width="1.5" />
      </svg></div>
    <div class="floating-component component-5"><!-- Resistor --><svg width="100" height="40" viewBox="0 0 100 40">
        <rect x="30" y="10" width="40" height="20" rx="2" stroke="white" stroke-width="2" fill="none" />
        <line x1="0" y1="20" x2="30" y2="20" stroke="white" stroke-width="2" />
        <line x1="70" y1="20" x2="100" y2="20" stroke="white" stroke-width="2" />
        <line x1="35" y1="12" x2="35" y2="18" stroke="white" stroke-width="1.5" />
        <line x1="40" y1="12" x2="40" y2="18" stroke="white" stroke-width="1.5" />
        <line x1="45" y1="12" x2="45" y2="18" stroke="white" stroke-width="1.5" />
        <line x1="50" y1="12" x2="50" y2="18" stroke="white" stroke-width="1.5" />
        <line x1="55" y1="12" x2="55" y2="18" stroke="white" stroke-width="1.5" />
        <line x1="60" y1="12" x2="60" y2="18" stroke="white" stroke-width="1.5" />
        <line x1="65" y1="12" x2="65" y2="18" stroke="white" stroke-width="1.5" />
      </svg></div>
    <div class="floating-component component-6"><!-- Capacitor --><svg width="60" height="50" viewBox="0 0 60 50">
        <line x1="30" y1="0" x2="30" y2="15" stroke="white" stroke-width="2" />
        <line x1="30" y1="35" x2="30" y2="50" stroke="white" stroke-width="2" />
        <line x1="20" y1="15" x2="40" y2="15" stroke="white" stroke-width="2" />
        <line x1="20" y1="35" x2="40" y2="35" stroke="white" stroke-width="2" />
        <line x1="20" y1="15" x2="20" y2="35" stroke="white" stroke-width="2" />
        <line x1="40" y1="15" x2="40" y2="35" stroke="white" stroke-width="2" />
      </svg></div>
    <div class="floating-component component-7"><!-- Transistor --><svg width="50" height="60" viewBox="0 0 50 60">
        <circle cx="25" cy="20" r="12" stroke="white" stroke-width="2" fill="none" />
        <line x1="25" y1="32" x2="25" y2="50" stroke="white" stroke-width="2" />
        <line x1="10" y1="20" x2="0" y2="20" stroke="white" stroke-width="1.5" />
        <line x1="25" y1="8" x2="25" y2="0" stroke="white" stroke-width="1.5" />
        <line x1="40" y1="20" x2="50" y2="20" stroke="white" stroke-width="1.5" />
        <line x1="20" y1="15" x2="15" y2="10" stroke="white" stroke-width="1" />
        <line x1="30" y1="15" x2="35" y2="10" stroke="white" stroke-width="1" />
      </svg></div>
    <div class="floating-component component-8"><!-- Breadboard --><svg width="140" height="90" viewBox="0 0 140 90">
        <rect x="10" y="10" width="120" height="70" rx="3" stroke="white" stroke-width="2" fill="none" />
        <rect x="15" y="15" width="110" height="60" rx="2" stroke="white" stroke-width="1.5" fill="none" />
        <!-- Horizontal rows -->
        <line x1="20" y1="25" x2="120" y2="25" stroke="white" stroke-width="0.5" opacity="0.6" />
        <line x1="20" y1="35" x2="120" y2="35" stroke="white" stroke-width="0.5" opacity="0.6" />
        <line x1="20" y1="45" x2="120" y2="45" stroke="white" stroke-width="0.5" opacity="0.6" />
        <line x1="20" y1="55" x2="120" y2="55" stroke="white" stroke-width="0.5" opacity="0.6" />
        <line x1="20" y1="65" x2="120" y2="65" stroke="white" stroke-width="0.5" opacity="0.6" />
        <!-- Vertical columns -->
        <line x1="30" y1="20" x2="30" y2="70" stroke="white" stroke-width="0.5" opacity="0.6" />
        <line x1="50" y1="20" x2="50" y2="70" stroke="white" stroke-width="0.5" opacity="0.6" />
        <line x1="70" y1="20" x2="70" y2="70" stroke="white" stroke-width="0.5" opacity="0.6" />
        <line x1="90" y1="20" x2="90" y2="70" stroke="white" stroke-width="0.5" opacity="0.6" />
        <line x1="110" y1="20" x2="110" y2="70" stroke="white" stroke-width="0.5" opacity="0.6" />
      </svg></div>
    <div class="floating-component component-9"><!-- Servo Motor --><svg width="80" height="70" viewBox="0 0 80 70">
        <rect x="15" y="20" width="50" height="40" rx="3" stroke="white" stroke-width="2" fill="none" />
        <rect x="20" y="25" width="40" height="30" rx="2" stroke="white" stroke-width="1.5" fill="none" />
        <circle cx="40" cy="40" r="8" stroke="white" stroke-width="2" fill="none" />
        <line x1="40" y1="32" x2="40" y2="20" stroke="white" stroke-width="1.5" />
        <line x1="40" y1="48" x2="40" y2="60" stroke="white" stroke-width="1.5" />
        <line x1="5" y1="35" x2="15" y2="35" stroke="white" stroke-width="1.5" />
        <line x1="5" y1="45" x2="15" y2="45" stroke="white" stroke-width="1.5" />
        <line x1="65" y1="35" x2="75" y2="35" stroke="white" stroke-width="1.5" />
        <line x1="65" y1="45" x2="75" y2="45" stroke="white" stroke-width="1.5" />
      </svg></div>
    <div class="floating-component component-10"><!-- Potentiometer --><svg width="70" height="70" viewBox="0 0 70 70">
        <rect x="20" y="20" width="30" height="30" rx="2" stroke="white" stroke-width="2" fill="none" />
        <line x1="0" y1="25" x2="20" y2="25" stroke="white" stroke-width="1.5" />
        <line x1="0" y1="35" x2="20" y2="35" stroke="white" stroke-width="1.5" />
        <line x1="50" y1="45" x2="70" y2="45" stroke="white" stroke-width="1.5" />
        <circle cx="35" cy="35" r="3" stroke="white" stroke-width="1.5" fill="none" />
        <line x1="35" y1="32" x2="35" y2="15" stroke="white" stroke-width="1.5" />
        <line x1="35" y1="15" x2="45" y2="5" stroke="white" stroke-width="1.5" />
      </svg></div>
    <div class="floating-component component-11"><!-- Switch --><svg width="60" height="50" viewBox="0 0 60 50">
        <rect x="15" y="15" width="30" height="20" rx="2" stroke="white" stroke-width="2" fill="none" />
        <line x1="0" y1="20" x2="15" y2="20" stroke="white" stroke-width="1.5" />
        <line x1="45" y1="30" x2="60" y2="30" stroke="white" stroke-width="1.5" />
        <line x1="30" y1="15" x2="30" y2="5" stroke="white" stroke-width="1.5" />
        <circle cx="30" cy="5" r="3" stroke="white" stroke-width="1.5" fill="none" />
      </svg></div>
    <div class="floating-component component-12"><!-- Battery --><svg width="50" height="80" viewBox="0 0 50 80">
        <rect x="10" y="10" width="30" height="60" rx="2" stroke="white" stroke-width="2" fill="none" />
        <rect x="35" y="30" width="8" height="20" rx="1" stroke="white" stroke-width="2" fill="none" />
        <line x1="15" y1="25" x2="15" y2="35" stroke="white" stroke-width="1" opacity="0.7" />
        <line x1="20" y1="25" x2="20" y2="35" stroke="white" stroke-width="1" opacity="0.7" />
        <line x1="25" y1="25" x2="25" y2="35" stroke="white" stroke-width="1" opacity="0.7" />
        <line x1="30" y1="25" x2="30" y2="35" stroke="white" stroke-width="1" opacity="0.7" />
      </svg></div>
    <div class="floating-component component-13"><!-- Diode --><svg width="60" height="50" viewBox="0 0 60 50">
        <line x1="0" y1="25" x2="20" y2="25" stroke="white" stroke-width="2" />
        <line x1="40" y1="25" x2="60" y2="25" stroke="white" stroke-width="2" />
        <polygon points="20,10 20,40 40,25" stroke="white" stroke-width="2" fill="none" />
        <line x1="20" y1="10" x2="20" y2="40" stroke="white" stroke-width="2" />
        <line x1="25" y1="20" x2="25" y2="30" stroke="white" stroke-width="1.5" />
      </svg></div>
    <div class="floating-component component-14"><!-- Microcontroller --><svg width="90" height="70"
        viewBox="0 0 90 70">
        <rect x="10" y="15" width="70" height="40" rx="2" stroke="white" stroke-width="2" fill="none" />
        <rect x="15" y="20" width="60" height="30" rx="1" stroke="white" stroke-width="1.5" fill="none" /><!-- Pins -->
        <line x1="10" y1="20" x2="5" y2="20" stroke="white" stroke-width="1" />
        <line x1="10" y1="25" x2="5" y2="25" stroke="white" stroke-width="1" />
        <line x1="10" y1="30" x2="5" y2="30" stroke="white" stroke-width="1" />
        <line x1="10" y1="35" x2="5" y2="35" stroke="white" stroke-width="1" />
        <line x1="10" y1="40" x2="5" y2="40" stroke="white" stroke-width="1" />
