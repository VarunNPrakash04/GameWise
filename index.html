<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arduino + Breadboard Simulator</title>

  <style>
    body { margin: 0; overflow: hidden; font-family: Inter, Arial, sans-serif; }

    /* Top UI bar */
    #uiBar {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 12px; /* spacing between elements */
      z-index: 200;
      align-items: center;
    }

    #addWireBtn {
      padding: 10px 16px;
      background: #333;
      color: white;
      border-radius: 6px;
      border: 1px solid #555;
      cursor: pointer;
      font-size: 14px;
    }

    #wireColorPicker {
      padding: 8px 10px;
      background: #333;
      color: white;
      border-radius: 6px;
      border: 1px solid #555;
      font-size: 14px;
      cursor: pointer;
    }

    #status {
      margin-left: 8px;
      padding: 6px 10px;
      background: rgba(0,0,0,0.5);
      color: #ddd;
      border-radius: 6px;
      font-size: 13px;
    }

    #pinLabel {
      position:absolute;
      padding:6px 10px;
      background:#111;
      color:#fff;
      border-radius:6px;
      font-size:14px;
      display:none;
      pointer-events:none;
      z-index:100;
      box-shadow:0 0 8px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <!-- UI BAR -->
  <div id="uiBar">
    <button id="addWireBtn">Add Wire</button>

    <select id="wireColorPicker" title="Pick color for next wire">
      <option value="0xff0000">Red</option>
      <option value="0x00ff00">Green</option>
      <option value="0x0000ff">Blue</option>
      <option value="0xffff00">Yellow</option>
      <option value="0xff00ff">Magenta</option>
      <option value="0x00ffff">Cyan</option>
      <option value="0xffffff">White</option>
      <option value="0x000000">Black</option>
    </select>

    <div id="status">Loading models...</div>
  </div>

  <div id="pinLabel"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
