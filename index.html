<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arduino Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    body { margin: 0; overflow: hidden; }

    /* Splash Screen */
    #splashScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      cursor: pointer;
    }

    #splashScreen.hidden {
      display: none;
    }

    #gameWiseContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin-bottom: 40px;
    }

    #subtitle {
      font-family: "Times New Roman", Times, serif;
      color: #ffffff;
      font-size: 24px;
      opacity: 0;
      animation: fadeIn 1s ease-out 2.5s forwards;
      text-align: center;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    /* Hide main content initially */
    #mainContent {
      opacity: 0;
      transition: opacity 0.5s ease-in;
    }

    #mainContent.visible {
      opacity: 1;
    }

    /* Top UI bar */
    #uiBar {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 12px; /* spacing between elements */
      z-index: 200;
    }

    #addWireBtn {
      padding: 10px 16px;
      background: #333;
      color: white;
      border-radius: 6px;
      border: 1px solid #555;
      cursor: pointer;
      font-size: 14px;
    }

    #wireColorPicker {
      padding: 10px;
      background: #333;
      color: white;
      border-radius: 6px;
      border: 1px solid #555;
      font-size: 14px;
      cursor: pointer;
    }

    #pinLabel {
      position:absolute;
      padding:6px 10px;
      background:#111;
      color:#fff;
      border-radius:6px;
      font-size:14px;
      display:none;
      pointer-events:none;
      z-index:100;
      box-shadow:0 0 8px rgba(0,0,0,0.4);
    }

    #sidebar {
      position: fixed;
      left: 10px;
      top: 120px;
      background: #1a1a1a;
      padding: 10px 20px;
      border-radius: 8px;
      color: white;
      z-index: 210;
    }

    .spawn {
      display: block;
      width: 100%;
      margin: 6px 0;
      padding: 8px;
      background: #333;
      color: white;
      border: none;
      cursor: pointer;
    }

    .spawn:hover {
      background: #444;
    }
  </style>
  <link rel="stylesheet" href="/src/Shuffle.css">
</head>
<body>

  <!-- Splash Screen -->
  <div id="splashScreen">
    <div id="gameWiseContainer">
      <div id="gameWiseText" class="shuffle-parent">GameWise</div>
    </div>
    <div id="subtitle">Learning has never been easier</div>
  </div>

  <!-- Main Content -->
  <div id="mainContent">
    <!-- UI BAR -->
  <div id="uiBar">
    <button id="addWireBtn">Add Wire</button>

    <select id="wireColorPicker">
      <option value="0xff0000">Red</option>
      <option value="0x00ff00">Green</option>
      <option value="0x0000ff">Blue</option>
      <option value="0xffff00">Yellow</option>
      <option value="0xff00ff">Magenta</option>
      <option value="0x00ffff">Cyan</option>
      <option value="0xffffff">White</option>
      <option value="0x000000">Black</option>
    </select>
  </div>

  <div id="pinLabel"></div>

  <div id="sidebar">
    <h3>Components</h3>
    <button class="spawn" data-type="LED">Add LED</button>
    <button class="spawn" data-type="RESISTOR">Add Resistor</button>
  </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
